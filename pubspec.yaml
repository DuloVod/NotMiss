name: notmiss
description: AI Voice Guide for Walking Tours
publish_to: none
version: 0.2.4+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Location / GPS
  geolocator: ^13.0.0

  # Networking (Gemini REST API)
  http: ^1.2.0

  # Audio playback
  just_audio: ^0.9.43
  audio_session: ^0.1.25

  # Temp file paths (for TTS audio)
  path_provider: ^2.1.0

  # .env file for API key
  flutter_dotenv: ^5.1.0

  # Utilities
  uuid: ^4.4.0
  flutter_foreground_task: ^11.0.3
  flutter_compass: ^0.8.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/stryiskyi_park.json
    - assets/audio/arrival_chime.wav

  # NotMiss design fonts (SIL Open Font License, see assets/fonts/OFL-*.txt)
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#EFEBE0"
  image: "assets/splash.png"
  android_12:
    image: "assets/splash.png"
    color: "#EFEBE0"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#EFEBE0"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true
