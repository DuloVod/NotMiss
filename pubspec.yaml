name: notmiss
description: AI Voice Guide for Walking Tours
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Location / GPS
  geolocator: ^13.0.0

  # Networking (Gemini REST API)
  http: ^1.2.0

  # Audio playback
  just_audio: ^0.9.43

  # Temp file paths (for TTS audio)
  path_provider: ^2.1.0

  # .env file for API key
  flutter_dotenv: ^5.1.0

  # Utilities
  uuid: ^4.4.0
  flutter_foreground_task: ^11.0.3
  flutter_compass: ^0.8.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/stryiskyi_park.json
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash.png"
  android_12:
    image: "assets/splash.png"
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/splash.png"
